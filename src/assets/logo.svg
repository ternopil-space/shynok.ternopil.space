<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Шинок — традиційний український ресторан">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#4A2D1A"/>
      <stop offset="100%" stop-color="#2A1608"/>
    </radialGradient>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#C89A3D" stroke-width="2.5"/>
  <!-- Inner thin ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C89A3D" stroke-width="0.6" opacity="0.55"/>
  <!-- Main emblem disc -->
  <circle cx="100" cy="100" r="86" fill="url(#bg-grad)"/>

  <!-- Castle silhouette — Ternopil Castle reference -->
  <g fill="#C89A3D" opacity="0.92">
    <!-- Battlements row -->
    <rect x="66" y="44" width="7"  height="11" rx="1.5"/>
    <rect x="78" y="38" width="7"  height="17" rx="1.5"/>
    <rect x="93" y="42" width="7"  height="13" rx="1.5"/>
    <rect x="108" y="38" width="7" height="17" rx="1.5"/>
    <rect x="120" y="44" width="7" height="11" rx="1.5"/>
    <!-- Castle body wall -->
    <rect x="64" y="55" width="65" height="22" rx="2"/>
    <!-- Gate arch (cutout) -->
    <rect x="89" y="60" width="16" height="17" rx="8 8 0 0" fill="#2A1608"/>
  </g>

  <!-- ШИНОК brand name -->
  <text
    x="100" y="107"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-weight="700"
    fill="#F4E9D8"
    text-anchor="middle"
    letter-spacing="5"
  >ШИНОК</text>

  <!-- Divider rule -->
  <line x1="58" y1="113" x2="142" y2="113" stroke="#C89A3D" stroke-width="0.8" opacity="0.7"/>

  <!-- Wheat stalks — left -->
  <g fill="none" stroke="#C89A3D" stroke-width="1.4" opacity="0.82" stroke-linecap="round">
    <line x1="42" y1="148" x2="52" y2="90"/>
    <ellipse cx="46.5" cy="118" rx="5"   ry="9"   transform="rotate(-18 46.5 118)"/>
    <ellipse cx="43"   cy="132" rx="4.5" ry="7.5" transform="rotate(-22 43 132)"/>
    <ellipse cx="50"   cy="105" rx="4.5" ry="7.5" transform="rotate(-12 50 105)"/>
  </g>

  <!-- Wheat stalks — right -->
  <g fill="none" stroke="#C89A3D" stroke-width="1.4" opacity="0.82" stroke-linecap="round">
    <line x1="158" y1="148" x2="148" y2="90"/>
    <ellipse cx="153.5" cy="118" rx="5"   ry="9"   transform="rotate(18 153.5 118)"/>
    <ellipse cx="157"   cy="132" rx="4.5" ry="7.5" transform="rotate(22 157 132)"/>
    <ellipse cx="150"   cy="105" rx="4.5" ry="7.5" transform="rotate(12 150 105)"/>
  </g>

  <!-- Water / wave motif — Ternopil Pond reference -->
  <g fill="none" stroke="#C89A3D" stroke-linecap="round" opacity="0.72">
    <path d="M 52 140 Q 70 133, 100 140 Q 130 147, 148 140" stroke-width="1.5"/>
    <path d="M 58 148 Q 76 141, 100 148 Q 124 155, 142 148" stroke-width="1"/>
  </g>

  <!-- ТЕРНОПІЛЬ sub-label -->
  <text
    x="100" y="168"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="7.5"
    fill="#C89A3D"
    text-anchor="middle"
    letter-spacing="3.5"
    opacity="0.88"
  >ТЕРНОПІЛЬ</text>
</svg>
